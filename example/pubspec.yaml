name: flutter_media_metadata_example
description: Demonstrates how to use the flutter_media_metadata plugin.
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_media_metadata:
    path: ../
  file_picker: ^10.3.7
  web: ^1.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
